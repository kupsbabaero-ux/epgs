name: Auto Update EPG

on:
  schedule:
    # Tumatakbo araw-araw tuwing 12:00 AM UTC (8:00 AM PH Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Pwede ring i-trigger nang manual kung kailangan

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate EPG XML
        run: python generate_epg.py

      - name: Commit and Push Updated XML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git commit -m "Auto-update EPG XML" || exit 0
          git push
